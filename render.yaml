services:
  # Backend API Service
  - type: web
    name: citizen-assistant-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GENERATION_MODEL
        value: gemini-3.1-flash-lite
      - key: EVIDENCE_THRESHOLD
        value: "0.40"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_PERIOD
        value: "60"
    healthCheckPath: /health

  # Frontend Web Service
  - type: web
    name: citizen-assistant-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: citizen-assistant-api
          property: host
