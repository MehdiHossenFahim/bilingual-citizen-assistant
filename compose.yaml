services:
  backend:
    build:
      context: .
      target: runtime
    container_name: citizen-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist vector DB and BM25 index across restarts
      - chroma_data:/app/data/chroma_db
      - bm25_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: citizen-assistant-ui
    ports:
      - "8501:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  bm25_data:

